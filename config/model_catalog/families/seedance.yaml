family: seedance
provider: volcengine
routing_prefixes:
  - seedance-
  - dreamina-seedance-
supported_backends:
  - vendor
default_backend: vendor
credential_sources:
  vendor:
    - ARK_API_KEY
    - SEEDANCE_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
transport:
  image_input_mode:
    vendor: ark_content_generation_image_url_roles
  audio_input_mode:
    vendor: ark_content_generation_audio_url
  reference_video_input_mode:
    vendor: ark_content_generation_video_url
docs:
  official_snapshot_ids:
    - volcengine/seedance-2.0/2026-07-01
models:
  - id: seedance/seedance-2.0-video
    display_name: Seedance 2.0 Video
    description: Seedance 2.0 video generation with first/last keyframes and role-tagged reference images
    status: active
    release_stage: stable
    docs:
      context_hub_doc_ids:
        - volcengine/seedance-2.0-video
    runtime:
      vendor:
        gateway: ark
        api_model_id: dreamina-seedance-2-0-260128
    modes:
      i2v:
        legacy_id: seedance-2.0-i2v
        display_name: Seedance 2.0 I2V
        description: Image-to-video with first-frame motion generation
        capabilities: [i2v, r2v]
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          recommended: true
          order: 115
          badges: [new]
        duration:
          type: slider
          min: 3
          max: 12
          step: 1
          default: 5
        params:
          resolution:
            options: [720p, 1080p]
            default: 1080p
          ratio:
            options: ["16:9", "9:16", "1:1", "4:3", "3:4", "adaptive"]
            default: "16:9"
          seed: true
          promptExtend: true
          watermark: true
        inputs:
          reference_images:
            max: 10
            reference_type: image
      r2v:
        legacy_id: seedance-2.0-r2v
        display_name: Seedance 2.0 R2V
        description: Keyframe/reference-image to video using first_frame, last_frame, and reference_image roles
        status: hidden
        capabilities: [r2v]
        ui:
          selection_group: i2v
          visible_in: []
          order: 15
        inputs:
          reference_images:
            max: 10
            reference_type: image
      t2v:
        legacy_id: seedance-2.0-t2v
        display_name: Seedance 2.0 T2V
        description: Text-to-video generation
        status: hidden
        capabilities: [t2v]
        ui:
          selection_group: i2v
          visible_in: []
          order: 5
